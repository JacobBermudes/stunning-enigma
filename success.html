<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurfBoost - Оплата прошла успешно!</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f8f9fa; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            background-color: #ffffff; 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(138, 43, 226, 0.1); 
            text-align: center; 
            max-width: 400px; 
            width: 90%;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            border-radius: 18px;
        }
        h1 { 
            color: #8A2BE2; 
            margin-bottom: 10px;
        }
        p { 
            color: #555; 
            line-height: 1.6; 
            font-size: 16px;
        }
        .highlight {
            font-weight: bold;
            color: #111;
        }
        .btn { 
            display: inline-block; 
            margin-top: 25px; 
            padding: 14px 28px; 
            background-color: #8A2BE2; 
            color: #ffffff; 
            text-decoration: none; 
            border-radius: 10px; 
            font-weight: bold; 
            transition: background-color 0.3s ease;
        }
        .btn:hover { 
            background-color: #741bce; 
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/logo.webp" alt="SurfBoost Logo" class="logo">
        <h1>Оплата прошла успешно!</h1>
        <p>Ваш доступ <span class="highlight">{{.Tier}}</span> на <span class="highlight">{{.Days}}</span> дней активирован. Приложение автоматически проводит фоновые проверки, поэтому никаких дополнительных действий не требуется.</p>
        <p>Пользуйтесь ВПН с удовольствием!</p>
    </div>
</body>
</html>
