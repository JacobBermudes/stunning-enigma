<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    
    <link rel="icon" type="image/png" href="/favicons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicons/favicon.svg" />
    <link rel="shortcut icon" href="/favicons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />
    <link rel="manifest" href="/favicons/site.webmanifest" />
    
    <title>SurfBoost - Оплата успешна</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: linear-gradient(135deg, #130622 0%, #2a0845 100%); 
            color: #ffffff;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
        }
        .container { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px 24px; 
            border-radius: 28px; 
            box-shadow: 0 24px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(138, 43, 226, 0.15); 
            text-align: center; 
            max-width: 420px; 
            width: 100%;
        }
        .logo {
            width: 100%;
            max-width: 327px;
            height: auto;
            display: block;
            margin: 0 auto 24px auto;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.5); 
        }
        h1 { 
            color: #e9d5ff;
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 26px;
            font-weight: 700;
            line-height: 1.3;
        }
        p { 
            color: #c4b5fd;
            line-height: 1.6; 
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .highlight {
            font-weight: 600;
            color: #ffffff;
            background: rgba(138, 43, 226, 0.4);
            padding: 4px 10px;
            border-radius: 8px;
            white-space: nowrap;
        }
        .btn { 
            display: inline-block; 
            width: 100%;
            margin-top: 12px; 
            padding: 18px 24px; 
            background: linear-gradient(90deg, #8A2BE2 0%, #6a0dad 100%); 
            color: #ffffff; 
            text-decoration: none; 
            border-radius: 16px; 
            font-weight: 700; 
            font-size: 17px;
            letter-spacing: 0.5px;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .btn:hover, .btn:active { 
            opacity: 0.9;
            transform: scale(0.98); 
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/logo.webp" alt="SurfBoost Logo" class="logo">
        <h1>Оплата успешна!</h1>
        <p>Ваш доступ <span class="highlight">{{.Tier}}</span> на <span class="highlight">{{.Days}}</span> дней активирован. Приложение автоматически проводит фоновые проверки, дополнительных действий не требуется.</p>
        <p>Пользуйтесь ВПН с удовольствием!</p>
    </div>
</body>
</html>
